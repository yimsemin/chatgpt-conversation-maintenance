<!doctype html>
<html lang="__LOCALE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="__APP_VERSION__">
<meta name="relay-version" content="__RELAY_VERSION__">
<title>__MSG_app.name__</title>
<script src="/assets/theme.js"></script>
<script type="module" src="/assets/language.js"></script>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="top">
  <div>
    <h1>__MSG_app.name__</h1>
    <p class="status" id="app-info" hidden></p>
  </div>
  <div class="top-right">
    <select id="language" aria-label="__MSG_common.language__">__LANGUAGE_OPTIONS__</select>
    <button class="pill" id="version" type="button" title="__MSG_app.releaseNotesButton__">v__APP_VERSION__</button>
    <a class="pill" href="__REPO_URL__" target="_blank" rel="noopener noreferrer" title="__MSG_app.repository__">GitHub</a>
    <button class="pill" id="relay-pill" type="button" aria-live="polite"><i class="dot"></i><span id="relay-label">__MSG_app.checkingConnection__</span></button>
    <button class="icon" id="theme" type="button" title="__MSG_app.toggleTheme__" aria-label="__MSG_app.toggleTheme__">◐</button>
  </div>
</header>
<p class="relay-hint" id="relay-hint" hidden></p>
<p class="relay-note" id="relay-note" hidden></p>

<main>
  <section class="failure callout bad" id="failure" hidden></section>
  <section class="now" id="now" aria-live="polite"></section>
  <ol class="steps" id="steps"></ol>
  <section class="panel" id="panel"></section>
</main>

<div class="aside">
  <div class="tabs" role="tablist">
    <button class="tab" type="button" data-tab="guide" role="tab">__MSG_app.guideTab__</button>
    <button class="tab" type="button" data-tab="recent" role="tab">__MSG_app.recentTab__</button>
    <button class="tab" type="button" data-tab="advanced" role="tab">__MSG_app.advancedTab__</button>
  </div>
  <section class="tabpanel" id="tab-guide" hidden><div id="guide" class="body"></div></section>
  <section class="tabpanel" id="tab-recent" hidden>
    <div class="body">
      <p class="muted small">__MSG_app.recentStorage__</p>
      <div id="recent" class="recent"></div>
      <div class="row"><button class="btn ghost" id="recent-clear" type="button">__MSG_app.clearRecent__</button></div>
    </div>
  </section>
  <section class="tabpanel" id="tab-advanced" hidden>
    <div class="body">
      <p class="muted small">__MSG_app.advancedHelp__</p>
      <div class="acts">
        <div class="act">
          <a class="btn ghost" href="/auth/bookmarklet" target="_blank" rel="noopener">__MSG_app.connectionHelp__</a>
          <p class="muted small">__MSG_app.connectionHelpHint__</p>
        </div>
        <div class="act">
          <button class="btn ghost" id="app-stop" type="button">__MSG_app.stopButton__</button>
          <p class="muted small">__MSG_app.stopHelp__</p>
        </div>
      </div>
    </div>
  </section>
</div>

<dialog id="changelog">
  <form method="dialog">
    <h2>__MSG_app.releaseNotes__</h2>
    <div id="changelog-body" class="changelog"></div>
    <div class="row"><button class="btn ghost" value="close">__MSG_app.close__</button></div>
  </form>
</dialog>
<dialog id="confirm"><form method="dialog" id="confirm-form"></form></dialog>
<div class="toast" id="toast" hidden></div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
