<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-release" content="__APP_RELEASE__">
<meta name="relay-protocol" content="__RELAY_PROTOCOL_VERSION__">
<title>대화 정리</title>
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="top">
  <h1>대화 정리</h1>
  <div class="top-right">
    <button class="pill" id="relay-pill" type="button" aria-live="polite"><i class="dot"></i><span id="relay-label">연결 확인 중…</span></button>
    <button class="icon" id="theme" type="button" title="테마 전환" aria-label="테마 전환">◐</button>
  </div>
</header>
<p class="relay-hint" id="relay-hint" hidden></p>
<p class="relay-note" id="relay-note" hidden></p>
<p class="relay-note" id="app-info" hidden></p>

<main>
  <section class="failure callout bad" id="failure" hidden></section>
  <section class="now" id="now" aria-live="polite"></section>
  <ol class="steps" id="steps"></ol>
  <section class="panel" id="panel"></section>
</main>

<div class="aside">
  <div class="tabs" role="tablist">
    <button class="tab" type="button" data-tab="guide" role="tab">사용 안내</button>
    <button class="tab" type="button" data-tab="recent" role="tab">최근 작업</button>
    <button class="tab" type="button" data-tab="advanced" role="tab">고급</button>
  </div>
  <section class="tabpanel" id="tab-guide" hidden><div id="guide" class="body"></div></section>
  <section class="tabpanel" id="tab-recent" hidden>
    <div class="body">
      <p class="muted small">이 컴퓨터의 <code>data/jobs</code> 폴더에 저장된 작업 기록입니다. ChatGPT에는 저장되지 않습니다. 지워도 정리 결과나 ChatGPT의 대화에는 영향이 없습니다.</p>
      <div id="recent" class="recent"></div>
      <div class="row"><button class="btn ghost" id="recent-clear" type="button">최근 작업 지우기</button></div>
    </div>
  </section>
  <section class="tabpanel" id="tab-advanced" hidden>
    <div class="body">
      <p class="muted small">평소에는 필요 없습니다. 전체를 처음부터 다시 정리하려면 조사 범위에서 ‘모든 대화’를 고르세요.</p>
      <div class="acts">
        <div class="act">
          <a class="btn ghost" href="/auth/bookmarklet" target="_blank" rel="noopener">ChatGPT 연결 방법</a>
          <p class="muted small">연결이 끊겼거나 처음 설치할 때 봅니다.</p>
        </div>
        <div class="act">
          <button class="btn ghost" id="app-stop" type="button">앱 종료</button>
          <p class="muted small">앱을 끕니다. 평소에는 앱을 켠 터미널 창을 닫거나 Ctrl+C 를 누르면 됩니다.</p>
        </div>
      </div>
    </div>
  </section>
</div>

<dialog id="confirm"><form method="dialog" id="confirm-form"></form></dialog>
<div class="toast" id="toast" hidden></div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
